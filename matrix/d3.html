<!DOCTYPE html>
<html lang="zh-CN" class="intro-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="难点 3：同一批数据、两种插入顺序，双画布同步长高；树高、平均与最坏查找步数随插入推进的折线，直观看到升序插入导致的退化。">
  <title>难点 3 · 插入顺序与树退化</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f3a5f'/%3E%3Cpath d='M16 7v8M16 15l-6 5M16 15l6 5' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='16' cy='7' r='2.5' fill='%23fff'/%3E%3Ccircle cx='10' cy='21' r='2.5' fill='%23fff'/%3E%3Ccircle cx='22' cy='21' r='2.5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=20261119m">
  <style>
    /* 双画布：两棵树并排，共用同一批数据；窄屏改成上下堆叠 */
    .canvases {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .canvas-col {
      min-width: 0;
    }

    .canvas-col svg {
      display: block;
      width: 100%;
      height: auto;
      background: #fbfcfe;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .canvas-col .caption {
      margin: 8px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: var(--sub);
      text-align: center;
    }

    /* 节点/连线尺寸随规模缩放：这两条自定义属性由 d3.js 按 n 写进每个 svg */
    .canvas-col svg .edge,
    .canvas-col svg .node-circle {
      stroke-width: var(--d3-stroke, 2);
    }

    .canvas-col svg .node-value {
      font-size: var(--d3-font, 15px);
    }

    /* 节点小到写不下数字时只留轮廓，看形状和读数 */
    .canvas-col svg.compact .node-value {
      display: none;
    }

    /* 读数：三张卡，每张同时给左、右两个值，颜色与两棵树呼应（左深蓝、右橙红） */
    .stage .metrics {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .stage .metric-value {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
    }

    .stage .mv {
      white-space: nowrap;
    }

    .stage .mv-left {
      color: var(--accent);
    }

    .stage .mv-right {
      /* 比 --path 略深，保证在浅蓝卡片上对比度 ≥ 4.5 */
      color: #a8431f;
    }

    .stage .metric-sep {
      color: var(--line);
      font-weight: 400;
    }

    #metrics-hint {
      margin-top: 10px;
      text-align: center;
    }

    /* 重排撞车时的兜底提示：用橙红提醒，但仍属于 hint 文案 */
    #reshuffle-note {
      color: var(--path);
    }

    /* 读数折线：左边深蓝、右边橙红，图例与两棵树一致 */
    .chart-block {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .chart-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .chart-title {
      margin: 0;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: var(--ink);
    }

    .chart-legend {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: var(--sub);
    }

    .chart-metric {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--sub);
    }

    .chart-metric select {
      font: inherit;
      font-size: 12px;
      padding: 3px 6px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
    }

    .chart-metric select:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-swatch {
      display: inline-block;
      width: 16px;
      height: 2px;
      border-radius: 1px;
    }

    .legend-left {
      background: var(--accent);
    }

    .legend-right {
      background: var(--path);
    }

    #chart {
      display: block;
      width: 100%;
      height: auto;
    }

    #chart .chart-grid {
      stroke: #e7ecf3;
      stroke-width: 1;
      stroke-dasharray: 3 3;
    }

    #chart .chart-axis {
      stroke: var(--line);
      stroke-width: 1;
    }

    #chart .chart-line {
      fill: none;
      stroke-width: 2.4;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    #chart .chart-line-left {
      stroke: var(--accent);
    }

    #chart .chart-line-right {
      stroke: var(--path);
    }

    #chart .chart-dot-left {
      fill: var(--accent);
    }

    #chart .chart-dot-right {
      fill: var(--path);
    }

    #chart .chart-cursor {
      stroke: var(--line);
      stroke-width: 1;
      stroke-dasharray: 3 3;
    }

    #chart .chart-tick {
      font-size: 10px;
      fill: var(--sub);
    }

    #chart .chart-axis-label {
      font-size: 11px;
      fill: var(--sub);
    }

    .chart-note {
      margin: 6px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: var(--sub);
      text-align: center;
    }

    /* 结论卡：只在最后一步出现 */
    #conclusion-card {
      border-left: 4px solid var(--new);
    }

    #conclusion-card h2 {
      color: var(--new);
    }

    #conclusion-card p {
      margin: 0;
      line-height: 1.7;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 900px) {
      .canvases {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="matrix.css?v=20261119m">
</head>
<body class="matrix d3">
<div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span><span class="a4"></span></div>
  <main class="wrap">
    <nav class="topbar">
      <a href="index.html">← 首页</a>
      <span class="crumb" aria-current="page">难点 3 / 3</span>
      <span class="spacer"></span>
      <a href="d1.html">← 难点 1 · 插入比较路径</a>
      <a href="d2.html">← 难点 2 · 删除双孩子</a>
    </nav>

    <header class="page-head">
      <h1 id="page-title">插入顺序与树退化</h1>
      <p class="subtitle" id="page-subtitle">同一批数据，插入顺序一换，树高和查找代价全变了</p>
    </header>

    <div class="layout">
      <section class="stage">
        <div class="canvases">
          <div class="canvas-col">
            <svg id="canvas-left" viewBox="0 0 400 360" role="img" aria-label="左树：按有序程度控制的插入顺序建成的二叉搜索树"></svg>
            <p class="caption" id="caption-left">左：有序程度 0% 的插入顺序</p>
          </div>
          <div class="canvas-col">
            <svg id="canvas-right" viewBox="0 0 400 360" role="img" aria-label="右树：按升序插入建成的二叉搜索树"></svg>
            <p class="caption" id="caption-right">右：升序插入（100%）</p>
          </div>
        </div>

        <div class="metrics" id="metrics"></div>
        <p class="hint" id="metrics-hint" hidden>规模较大时节点上的数字会自动隐去，只保留树形轮廓——这时看形状和读数更直观。</p>

        <div class="chart-block">
          <div class="chart-head">
            <h2 class="chart-title" id="chart-title">读数随插入怎么长</h2>
            <label class="chart-metric">
              <span id="chart-metric-label">折线读数</span>
              <select id="chart-metric" aria-label="选择折线图显示的读数"></select>
            </label>
            <div class="chart-legend">
              <span class="legend-item"><i class="legend-swatch legend-left"></i><span id="chart-legend-left">左</span></span>
              <span class="legend-item"><i class="legend-swatch legend-right"></i><span id="chart-legend-right">右</span></span>
            </div>
          </div>
          <svg id="chart" viewBox="0 0 400 206" role="img" aria-label="左右两棵树的读数随插入步数变化的折线图"></svg>
          <p class="chart-note" id="chart-note"></p>
        </div>

        <div class="transport">
          <button id="btn-play" class="primary">播放</button>
          <button id="btn-pause">暂停</button>
          <button id="btn-prev" disabled>上一步</button>
          <button id="btn-next">下一步</button>
          <button id="btn-reset">重置</button>
          <p id="status" aria-live="polite">第 1 / 20 步</p>
        </div>
      </section>

      <aside class="side">
        <div class="card">
          <h2 id="label-params">参数与播放</h2>
          <div id="params"></div>
          <div class="controls">
            <button id="btn-reshuffle">重排</button>
          </div>
          <p class="hint" id="reshuffle-hint"></p>
          <p class="hint note" id="reshuffle-note" hidden></p>
        </div>

        <div class="card">
          <h2 id="label-step">这一步在说什么</h2>
          <p id="panel-step" aria-live="polite">—</p>
        </div>

        <div class="card" id="conclusion-card" hidden>
          <h2 id="label-conclusion">结论</h2>
          <p id="panel-conclusion" aria-live="polite">—</p>
        </div>
      </aside>
    </div>
    <nav class="page-nav" aria-label="学习路径">
      <a href="d2.html">← 难点 2：删除双孩子</a>
      <a class="next" href="index.html">完成，返回首页 →</a>
    </nav>
  </main>

  <script src="js/common.js"></script>
  <script src="js/tree.js"></script>

</body>
